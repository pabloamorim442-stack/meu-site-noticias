name: 🤖 Atualizar Notícias

on:
  schedule:
    - cron: '0 */6 * * *'   # A cada 6 horas
  workflow_dispatch:         # Permite rodar manualmente

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Baixar o repositório
        uses: actions/checkout@v5

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🚀 Rodar o robô coletor + postar no Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python scraper.py

      - name: 💾 Salvar dados no repositório
        run: |
          git config user.name "Robô de Notícias"
          git config user.email "robo@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Notícias atualizadas automaticamente"
          git push
