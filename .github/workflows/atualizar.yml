name: 🤖 Atualizar Notícias

on:
  schedule:
    # Roda a cada 6 horas (formato: minuto hora dia mês dia-semana)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Permite rodar manualmente clicando num botão

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Baixar o repositório
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🚀 Rodar o robô coletor
        run: python scraper.py

      - name: 💾 Salvar as notícias no repositório
        run: |
          git config user.name "Robô de Notícias"
          git config user.email "robo@github.com"
          git add data/noticias.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Notícias atualizadas automaticamente"
          git push
